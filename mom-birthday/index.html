<style>

body{
margin:0;
font-family:Arial;
text-align:center;
overflow-x:hidden;
background:linear-gradient(135deg,#ffe4e1,#ffd6e7,#fff0f5);
}

/* INTRO */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:1000;
background:linear-gradient(135deg,#ffe4e1,#ffd6e7,#fff0f5);
overflow:hidden;
}

#intro h1{
font-size:8vw;
color:#ff4d6d;
animation:heartbeat 2s infinite;
}

@keyframes heartbeat{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

/* intro floating elements */

.introHeart{
position:absolute;
font-size:6vw;
animation:introFloat 8s linear infinite;
}

.introBalloon{
position:absolute;
font-size:7vw;
animation:introFloat 10s linear infinite;
}

@keyframes introFloat{
0%{transform:translateY(0);opacity:0}
20%{opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}

/* MAIN PAGE */

#main{
display:none;
padding:10px;
}

h1{
color:#ff4d6d;
margin-top:30px;
font-size:7vw;
}

/* CAROUSEL */

.carousel{
width:70vw;
height:70vw;
margin:30px auto;
position:relative;
transform-style:preserve-3d;
animation:spin 16s linear infinite;
}

.carousel img{
position:absolute;
width:60vw;
height:60vw;
border-radius:15px;
object-fit:cover;
left:5vw;
top:5vw;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.carousel img:nth-child(1){transform:rotateY(0deg) translateZ(45vw);}
.carousel img:nth-child(2){transform:rotateY(90deg) translateZ(45vw);}
.carousel img:nth-child(3){transform:rotateY(180deg) translateZ(45vw);}
.carousel img:nth-child(4){transform:rotateY(270deg) translateZ(45vw);}

@keyframes spin{
from{transform:rotateY(0)}
to{transform:rotateY(360deg)}
}

/* BUTTON */

button{
padding:15px 25px;
font-size:5vw;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

/* MESSAGE */

.message{
background:white;
padding:25px;
margin:40px auto;
width:90%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
font-size:4.5vw;
}

/* FLOATING HEARTS */

.heart{
position:fixed;
bottom:-20px;
font-size:6vw;
animation:heartUp 6s linear;
}

@keyframes heartUp{
0%{transform:translateY(0)}
100%{transform:translateY(-110vh)}
}

/* BALLOONS */

.balloon{
position:fixed;
bottom:-60px;
font-size:9vw;
animation:balloonUp 9s linear;
}

@keyframes balloonUp{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

/* CONFETTI */

.confetti{
position:fixed;
width:10px;
height:10px;
animation:fall 4s linear forwards;
}

@keyframes fall{
to{transform:translateY(120vh)}
}

/* MEMORY PHOTOS */

.memory-photo{
position:fixed;
width:35vw;
border-radius:12px;
opacity:0;
animation:fadeIn 2s forwards;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

@keyframes fadeIn{
to{opacity:1}
}

/* FINAL SCENE */

#finalScene{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.65);
backdrop-filter:blur(10px);
z-index:9999;
color:white;
padding:20px;
text-align:center;
}

#finalScene img{
width:70vw;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

#finalText{
font-size:5vw;
max-width:90%;
margin-top:20px;
line-height:1.6;
}

.signature{
margin-top:25px;
opacity:0.8;
font-size:4vw;
}

.finalHeart{
position:absolute;
font-size:6vw;
animation:floatHeart 6s linear infinite;
}

@keyframes floatHeart{
0%{transform:translateY(0);opacity:0}
20%{opacity:1}
100%{transform:translateY(-200px);opacity:0}
}

</style>
